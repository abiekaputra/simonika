services:
  app:
    build: .
    ports:
      - '8080:80'
    environment:
      APP_ENV: local
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/docker/database.sqlite
      SIMONIKA_DEMO_SEED: 'false'
    volumes:
      - simonika-data:/var/www/html/storage/docker

volumes:
  simonika-data:
